<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>Edit Student</h2>

    <form method="post" th:action="@{/students/update}" class="card p-3">

        <input type="hidden" th:value="${student.studentId}" name="studentId">

        <input type="text" th:value="${student.name}" name="name" class="form-control mb-2">

        <input type="email" th:value="${student.email}" name="email" class="form-control mb-2">

        <input type="text" th:value="${student.phone}" name="phone" class="form-control mb-2">

        <button class="btn btn-success">Update</button>

    </form>

</div>

</body>
</html>
