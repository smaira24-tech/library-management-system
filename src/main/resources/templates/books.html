<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="navbar :: navbar"></div>

<div class="container mt-4">

    <h2 class="text-primary">📚 Books</h2>

    <form method="get" action="/books" class="mb-3">
        <input type="text" name="keyword" placeholder="Search by title" class="form-control">
    </form>

    <form method="post" th:action="@{/books}" class="card p-3 mb-4">

        <input type="text" name="title" placeholder="Title" class="form-control mb-2" required>
        <input type="text" name="author" placeholder="Author" class="form-control mb-2">
        <input type="text" name="publisher" placeholder="Publisher" class="form-control mb-2">
        <input type="number" name="year" placeholder="Year" class="form-control mb-2">
        <input type="number" name="quantity" placeholder="Quantity" class="form-control mb-2">

        <button class="btn btn-primary">Add Book</button>
    </form>

    <table class="table table-bordered">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Qty</th>
            <th>Actions</th>
        </tr>

        <tr th:each="b : ${books}">
            <td th:text="${b.bookId}"></td>
            <td th:text="${b.title}"></td>
            <td th:text="${b.author}"></td>
            <td th:text="${b.quantity}"></td>

            <td>
                <a th:href="@{/books/edit/{id}(id=${b.bookId})}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{/books/delete/{id}(id=${b.bookId})}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
    </table>

</div>
</body>
</html>
