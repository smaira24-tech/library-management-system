<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Return Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="navbar :: navbar"></div>

<div class="container mt-4">

    <h2 class="text-danger">🔄 Return Book</h2>

    <form method="post" th:action="@{/return}" class="card p-3 mb-4">

        <input type="number" name="issueId" placeholder="Issue ID" class="form-control mb-2" required>

        <button class="btn btn-danger">Return Book</button>
    </form>

    <p th:text="${msg}" class="text-success"></p>
    <p th:text="${fine}" class="text-primary"></p>

    <h3>Returned Books</h3>

    <table class="table table-bordered">
        <tr>
            <th>Return ID</th>
            <th>Issue ID</th>
            <th>Book ID</th>
            <th>Book Name</th>
            <th>Student ID</th>
            <th>Student Name</th>
            <th>Return Date</th>
            <th>Fine</th>
        </tr>

        <tr th:each="r : ${returns}">
            <td th:text="${r.returnId}"></td>
            <td th:text="${r.issue.issueId}"></td>
            <td th:text="${r.issue.book.bookId}"></td>
            <td th:text="${r.issue.book.title}"></td>
            <td th:text="${r.issue.student.studentId}"></td>
            <td th:text="${r.issue.student.name}"></td>
            <td th:text="${r.returnDate}"></td>
            <td th:text="${r.fine}"></td>
        </tr>
    </table>

</div>
</body>
</html>
