<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>Edit Book</h2>

    <form method="post" th:action="@{/books/update}" class="card p-3">

        <input type="hidden" th:value="${book.bookId}" name="bookId">

        <input type="text" th:value="${book.title}" name="title" class="form-control mb-2">
        <input type="text" th:value="${book.author}" name="author" class="form-control mb-2">
        <input type="number" th:value="${book.quantity}" name="quantity" class="form-control mb-2">

        <button class="btn btn-success">Update</button>
    </form>

</div>
</body>
</html>
