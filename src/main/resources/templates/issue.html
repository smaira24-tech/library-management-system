<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Issue Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="navbar :: navbar"></div>

<div class="container mt-4">

    <h2 class="text-warning">📤 Issue Book</h2>

    <form method="post" th:action="@{/issue}" class="card p-3 mb-4">

        <input type="number" name="studentId" placeholder="Student ID" class="form-control mb-2" required>
        <input type="number" name="bookId" placeholder="Book ID" class="form-control mb-2" required>
        <input type="date" name="issueDate" class="form-control mb-2" required>
        <input type="date" name="dueDate" class="form-control mb-2" required>

        <button class="btn btn-warning">Issue Book</button>
    </form>

    <p th:text="${msg}" class="text-success"></p>

    <h3>Issued Books</h3>

    <table class="table table-bordered">
        <tr>
            <th>Issue ID</th>
            <th>Book ID</th>
            <th>Book Name</th>
            <th>Student ID</th>
            <th>Student Name</th>
            <th>Issue Date</th>
            <th>Due Date</th>
        </tr>

        <tr th:each="i : ${issues}">
            <td th:text="${i.issueId}"></td>
            <td th:text="${i.book.bookId}"></td>
            <td th:text="${i.book.title}"></td>
            <td th:text="${i.student.studentId}"></td>
            <td th:text="${i.student.name}"></td>
            <td th:text="${i.issueDate}"></td>
            <td th:text="${i.returnDate}"></td>
        </tr>
    </table>

</div>
</body>
</html>
