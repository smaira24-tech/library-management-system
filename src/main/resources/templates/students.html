<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div th:replace="navbar :: navbar"></div>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-success">👨‍🎓 Students</h2>
        <span class="badge bg-dark">Total: <span th:text="${total}"></span></span>
    </div>

    <!-- SEARCH -->
    <form method="get" action="/students" class="mb-3">
        <input type="text" name="keyword" placeholder="🔍 Search by name" class="form-control">
    </form>

    <!-- ADD FORM -->
    <form method="post" th:action="@{/students}" class="card p-3 mb-4 shadow-sm">

        <input type="text" name="name" placeholder="Enter Name" class="form-control mb-2" required>

        <input type="email" name="email" placeholder="Enter Email" class="form-control mb-2">

        <input type="text" name="phone" placeholder="Enter Phone" class="form-control mb-2">

        <button class="btn btn-success">Add Student</button>

    </form>

    <!-- TABLE -->
    <table class="table table-hover table-bordered">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="s : ${students}">

            <td th:text="${s.studentId}"></td>

            <td>
                <span class="badge bg-success p-2" th:text="${s.name}"></span>
            </td>

            <td th:text="${s.email}"></td>

            <td th:text="${s.phone}"></td>

            <td>
                <a th:href="@{/students/edit/{id}(id=${s.studentId})}"
                   class="btn btn-warning btn-sm">Edit</a>

                <a th:href="@{/students/delete/{id}(id=${s.studentId})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this student?')">
                    Delete
                </a>
            </td>

        </tr>
        </tbody>

    </table>

</div>

</body>
</html>
